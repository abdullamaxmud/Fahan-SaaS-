<title>HospitalOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: clinical workspace shell — permission-aware sidebar, sticky command bar, role-adaptive canvas.
   Palette: "scrub teal" on green-biased neutrals; semantic + ESI triage colours kept separate from the accent. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E7EEEB; --surface-3:#D9E4E0;
  --ink:#0C1816; --ink-2:#465955; --ink-3:#768A85; --line:#D2DDD9; --line-2:#BFCDC8;
  --accent:#0A7468; --accent-2:#075A51; --accent-soft:#D2EBE6; --on-accent:#FFFFFF;
  --ok:#1C7A45; --ok-soft:#DCF0E3; --warn:#9F620B; --warn-soft:#F6EAD2; --crit:#BD2D39; --crit-soft:#F8DDE0; --info:#2A5CA6; --info-soft:#DEE7F6;
  --esi1:#BD2D39; --esi2:#D2611D; --esi3:#B8950A; --esi4:#2C8653; --esi5:#2A5CA6;
  --shadow:0 1px 2px rgba(12,24,22,.06),0 10px 30px -14px rgba(12,24,22,.22);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09110F; --surface:#0F1A18; --surface-2:#15221F; --surface-3:#1C2C28;
  --ink:#E2EDEA; --ink-2:#9BAEA9; --ink-3:#6B807A; --line:#20312D; --line-2:#2C403B;
  --accent:#36C2AD; --accent-2:#62D7C5; --accent-soft:#0D3832; --on-accent:#03201B;
  --ok:#4DC181; --ok-soft:#113021; --warn:#E2A945; --warn-soft:#33270F; --crit:#EF666F; --crit-soft:#391619; --info:#70A1EE; --info-soft:#13223B;
  --esi1:#EF666F; --esi2:#EE8B4C; --esi3:#E0C247; --esi4:#4DC181; --esi5:#70A1EE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09110F; --surface:#0F1A18; --surface-2:#15221F; --surface-3:#1C2C28;
  --ink:#E2EDEA; --ink-2:#9BAEA9; --ink-3:#6B807A; --line:#20312D; --line-2:#2C403B;
  --accent:#36C2AD; --accent-2:#62D7C5; --accent-soft:#0D3832; --on-accent:#03201B;
  --ok:#4DC181; --ok-soft:#113021; --warn:#E2A945; --warn-soft:#33270F; --crit:#EF666F; --crit-soft:#391619; --info:#70A1EE; --info-soft:#13223B;
  --esi1:#EF666F; --esi2:#EE8B4C; --esi3:#E0C247; --esi4:#4DC181; --esi5:#70A1EE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--ink-3);margin-top:-2px}
.who{margin:4px 12px 8px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left;width:calc(100% - 24px)}
.who:hover{border-color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent-2);flex:none;font-family:var(--f-display)}
.who-txt{min-width:0;flex:1}
.who-txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:6px 10px 12px;flex:1}
.nav-group{margin-top:14px}
.nav-group>.eyebrow{padding:0 10px 6px;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2)}
.nav a.locked{opacity:.5}
.nav a .lv{margin-left:auto}
.nav a span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid var(--line);padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);padding:4px 6px}
.tog{position:relative;width:34px;height:20px;border-radius:20px;background:var(--surface-3);border:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{transform:translateX(14px)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.icon-btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
#menuBtn{display:none}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.crumb .tenant{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;min-width:0}
.crumb .tenant b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);min-width:0;margin-left:auto}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:none;padding:0 10px;height:34px;font-size:12px;font-weight:600;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pulse{flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.pulse svg{width:74px;height:22px}
.pulse path{fill:none;stroke:var(--ok);stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:160;animation:ecg 2.4s linear infinite}
@keyframes ecg{from{stroke-dashoffset:160}to{stroke-dashoffset:-160}}
@media (prefers-reduced-motion:reduce){.pulse path{animation:none;stroke-dasharray:none}*{transition:none!important}}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;background:var(--ink);color:var(--surface);padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px))}
.banner b{font-weight:600}
.banner button{margin-left:auto;border:1px solid color-mix(in srgb,var(--surface) 35%,transparent);background:none;color:var(--surface);border-radius:7px;padding:3px 10px;font-size:12px}

.view{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-in{max-width:1380px;margin:0 auto;padding-inline:clamp(0px,1.6vw,20px);display:flex;flex-direction:column;gap:20px}

/* ---------- page header ---------- */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:stretch}
.ph-main{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.ph h1{font-size:clamp(26px,3.2vw,38px);font-weight:800;line-height:1.08}
.ph .sub{color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.ph .sub span{display:inline-flex;align-items:center;gap:6px}
.scope{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px 14px 14px}
.scope svg{width:112px;height:112px;flex:none}
.scope ol{list-style:none;margin:0;padding:0;font-size:12px;display:grid;gap:2px}
.scope li{display:flex;align-items:center;gap:7px;color:var(--ink-3)}
.scope li i.b{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.scope li.in{color:var(--ink)}
.scope li.in i.b{background:var(--accent);border-color:var(--accent)}
.scope li.at{font-weight:700;color:var(--accent-2)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:650}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:4px 16px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.g2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)} .crit{background:var(--crit-soft);color:var(--crit)} .info{background:var(--info-soft);color:var(--info)} .acc{background:var(--accent-soft);color:var(--accent-2)}
.lv{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 4px;border-radius:5px;font-family:var(--f-mono);font-size:10.5px;font-weight:600}
.lv-V{background:var(--surface-3);color:var(--ink-2)} .lv-E{background:var(--info-soft);color:var(--info)} .lv-S{background:var(--accent-soft);color:var(--accent-2)} .lv-A{background:var(--ink);color:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn .lucide{width:16px;height:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
td .s{display:block;font-size:12px;color:var(--ink-3)}
.r-num{text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.li .bd{flex:1;min-width:0}
.li .bd b{font-weight:600;display:block}
.li .bd span{font-size:12.5px;color:var(--ink-2)}
.li .rt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:13px;align-items:flex-start}
.note .lucide{margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.cite{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent-2);vertical-align:1px;white-space:nowrap}
.bar{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}

/* pipeline / state machine */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:2px 0}
.pipe .st{flex:1;min-width:112px;position:relative;padding:10px 14px 10px 22px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.pipe .st:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:14px;border-radius:10px 0 0 10px;border-left:1px solid var(--line)}
.pipe .st+.st{margin-left:-6px}
.pipe .st b{display:block;font-family:var(--f-display);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.pipe .st span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pipe .st.cur{background:var(--accent);color:var(--on-accent)}
.pipe .st.cur span{color:var(--on-accent);opacity:.85}
.pipe .st.done{background:var(--accent-soft)}
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rail .step{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.rail .ar{color:var(--ink-3);font-size:12px}

/* wristband */
.band{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:repeating-linear-gradient(180deg,var(--accent) 0 10px,var(--accent-2) 10px 20px)}
.band h2{font-size:24px;font-weight:800}
.band .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:4px}
.barcode{display:flex;align-items:stretch;height:40px;gap:1px}
.barcode i{background:var(--ink);display:block}
.barcode-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.allergy{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}

/* beds */
.ward{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bed{border:1px solid var(--line);border-radius:10px;padding:8px 9px;min-height:76px;display:flex;flex-direction:column;gap:3px;background:var(--surface);text-align:left;font-size:12px;position:relative}
.bed b{font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.bed .nm{font-weight:600;font-size:12.5px;line-height:1.25;color:var(--ink)}
.bed .stt{font-size:11px;color:var(--ink-3);margin-top:auto}
.bed.O{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.bed.A{background:var(--surface);border-style:dashed}
.bed.R{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,var(--line))}
.bed.C{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.bed.I{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.bed.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-2)}

/* ER board */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 2px;font-weight:700;font-size:13px}
.col-h .sq{width:12px;height:12px;border-radius:3px}
.col-h .c{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.pc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:8px 10px;font-size:12.5px}
.pc b{display:block;font-size:13px}
.pc .m{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:3px;gap:6px}

/* theatre */
.tl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;align-items:center;min-width:560px}
.tl-hours{position:relative;height:18px;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.tl-hours span{position:absolute;transform:translateX(-50%)}
.tl-row{position:relative;height:50px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 1px,transparent 1px 10%);border:1px solid var(--line);border-radius:9px}
.tl-blk{position:absolute;top:5px;bottom:5px;border-radius:7px;padding:4px 8px;font-size:11.5px;line-height:1.25;overflow:hidden;border:1px solid transparent}
.tl-blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab{font-weight:700;font-size:13px}

function tone(s){if(/Released|Final|Paid|Posted|Completed|Closed|Active|Published|Dispensed|Discharged|Verified|Administered|HandedOver|Settled|Enabled|Received|Approved|Signed|Healthy|Passed|Balanced|Matched/.test(s))return'ok';if(/Cancel|Void|Reject|Suspend|NoShow|Reversed|OutOfService|Critical|Failed|Overdue/.test(s))return'crit';if(/Pending|Waiting|Review|Draft|Onboarding|Due|Low|Prelim/.test(s))return'warn';return'info'}
const kpi=(l,v,d='',dt='')=>`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span>${d?`<span class="d">${dt?pill(dt.split('|')[0],dt.split('|')[1]):''}${d}</span>`:''}</div>`;

const li=(icn,t,s,rt='',c='')=>`<div class="li"><span class="ic ${c}">${ic(icn)}</span><div class="bd"><b>${t}</b><span>${s}</span></div>${rt?`<span class="rt">${rt}</span>`:''}</div>`;

function spark(vals,w=120,h=34,col='var(--accent)'){const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>[i*(w-6)/(vals.length-1)+3,h-4-(v-mn)/r*(h-10)]);const d=pts.map(p=>p.join(',')).join(' ');const last=pts[pts.length-1];return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="3,${h} ${d} ${w-3},${h}" fill="${col}" opacity=".12"/><polyline points="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`}
function barcode(str){let o='';for(const ch of str){const c=ch.charCodeAt(0);o+=`<i style="width:${c%3+1}px"></i><i style="width:1px;background:transparent"></i><i style="width:${(c>>2)%2+1}px"></i><i style="width:${c%2+1}px;background:transparent"></i>`}return`<div class="barcode" aria-hidden="true">${o}</div>`}
function pipe(states,counts,cur){return`<div class="pipe">${states.map((s,i)=>`<div class="st ${i===cur?'cur':i<cur?'done':''}"><b>${counts?counts[i]:''}</b><span>${s}</span></div>`).join('')}</div>`}
function toast(msg,icn='check-circle-2'){const t=$('#toast');t.innerHTML=ic(icn)+`<span>${msg}</span>`;t.hidden=false;icons();clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function icons(){if(window.lucide)lucide.createIcons({attrs:{'stroke-width':1.75}})}
function stamp(n){return`${String(Math.floor(n/60)+7).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}

function scopePanel(r){const at=SCOPES.indexOf(r.scope);const cx=56,step=7.2;let rings='';SCOPES.forEach((s,i)=>{const rad=52-i*step;const inn=i>=at;rings+=`<circle cx="${cx}" cy="${cx}" r="${rad}" fill="${inn?'var(--accent)':'var(--surface-2)'}" fill-opacity="${inn?(0.16+(i-at)*0.12):1}" stroke="${i===at?'var(--accent)':'var(--line-2)'}" stroke-width="${i===at?2:1}"/>`});
 rings+=`<circle cx="${cx}" cy="${cx}" r="${52-6*step-4}" fill="var(--accent)"/>`;
 return`<div class="scope" aria-label="Access scope"><svg viewBox="0 0 112 112" role="img" aria-label="Scope: ${r.scope}">${rings}</svg><div><span class="eyebrow">${L('Access reach','Heerka gelitaanka')}</span><ol>${SCOPES.map((s,i)=>`<li class="${i>=at?'in':''} ${i===at?'at':''}"><i class="b"></i>${s}${i===at?' ←':''}</li>`).join('')}</ol></div></div>`}

const SUBJ={org:['Mogadishu Central','Hodan branch','Wadajir clinic','Radiology dept.','Ward 3B'],iam:['Dr. Mahad Nuur','Ubah Kahin','Role: Cashier v6','Grant: ICU temp','Hamse Aar'],inv:['Insulin glargine','Gloves M (box)','IV cannula 20G','Amoxicillin 500 mg','Saline 0.9% 1L'],proc:['Hormuud Medical Supplies','Gacal Pharma','Bakaal Lab Reagents','Durdur Equipment','Taaj Linen'],eq:['CT-2 Siemens','Autoclave A2','Infusion pump #14','Ventilator ICU-3','Anaesthesia OT-3'],hr:['Night roster W48','Payroll Nov 2026','Leave: Deeqa Ali','Contract: Dr. Osman','BLS renewals'],acct:['JE-2611-0012','Cost centre RAD','Expense: diesel','Period Nov 2026','Accrual: utilities'],bi:['OPD weekly','Bed occupancy','Lab TAT','Collections rate','No-show rate'],aifin:['Oct variance','Service mix Q3','Collections forecast','Refund anomalies','Payer mix'],aidis:['Malaria · Oct','Hypertension · Q3','Pneumonia <5y','Diabetes cohort','Readmissions'],ai360:['October 2026','September 2026','August 2026','July 2026','June 2026'],studio:['Antenatal intake v3','Refund approval flow','Discharge checklist','Incident form v2','Bed cleaning SLA'],intg:['FHIR R4 · MoH registry','DICOMweb · PACS','Mobile money webhook','SMS gateway','ICD-11 API'],sec:['Denied burst · 12 req','Restore drill Nov','Access review Q4','New device login','Key rotation'],plat:['Hiil Medical Group','Badbaado Hospital','Daryeel W&C','Nabad Specialist','Rajo Clinic Network'],qual:['Fall · Ward 3B','Med error near-miss','CLABSI review','Hand hygiene audit','Pressure injury'],bill:['INV-2611-03318','INV-2611-03315','INV-2611-03309','INV-2611-03320','INV-2611-03322'],ins:['CLM-2611-0201','CLM-2611-0198','CLM-2611-0187','CLM-2611-0176','CLM-2611-0170']};
function modulePage(k){const m=M[k],r=role(),l=r.acc[k];const pc=['care','dx','meds'].includes(m.g)&&!SUBJ[k];
 const rows=[0,1,2,3,4].map(i=>{const st=m.st[(i*2+k.length)%m.st.length];const subj=pc?pnt(PATIENTS[(i*3+k.length)%PATIENTS.length]):`<b>${(SUBJ[k]||SUBJ.org)[i]}</b>`;return[`<span class="mono">${k.toUpperCase()}-2611-${String(140+i*7)}</span>`,subj,pill(st,tone(st)),['08:42','08:17','07:55','Yesterday','22 Nov'][i],['Dr. Hodan Warsame','Deeqa Ali','Hamse Aar','Hawa Jibriil','System'][i]]});
 const counts=m.st.map((_,i)=>[12,9,6,4,31][i]??3);
 return`<div class="ph"><div class="ph-main"><span class="eyebrow">Spec ${m.num} · ${GROUPS.find(g=>g[0]===m.g)[1]}</span><h1>${modName(m)}</h1><div class="sub"><span>${ic('users')}${m.actors}</span><span>${L('Your access','Gelitaankaaga')}: ${lvBadge(l)} ${LV[l]}</span></div><p class="muted" style="margin:2px 0 0;max-width:72ch">${m.purpose}</p></div>${scopePanel(r)}</div>
 ${card(L('Lifecycle','Wareegga'),`<div class="card-b">${pipe(m.st,counts,1)}</div>`,`<span class="faint" style="font-size:12px">Allowed transitions only · each one audited</span>`)}
 <div class="g2"><div class="stack">${card(L('Records','Diiwaanada'),table(['ID','Subject','State','Updated','By'],rows),`<label class="search" style="height:32px;max-width:220px;margin:0">${ic('search')}<input placeholder="Filter" aria-label="Filter records"></label>${l==='V'?'':`<button class="btn sm pri" data-act="toast" data-v="New ${m.n.toLowerCase()} record · draft created">${ic('plus')}New</button>`}`)}</div>
 <div class="stack">${card(L('Business rule','Xeerka'),`<div class="card-b stack" style="gap:10px"><div class="note warn">${ic('shield-alert')}<span>${m.rule}</span></div><div class="note ok">${ic('check-circle-2')}<span><b>Acceptance:</b> ${m.acc}</span></div></div>`)}
 ${card(L('Data entities','Xogta'),`<div class="card-b chips">${m.ent.split(', ').map(e=>`<span class="chip">${e}</span>`).join('')}</div>`)}</div></div>`}

function deniedPage(k){const m=M[k],r=role();return`<div class="card denied"><span class="code">HTTP 403 · PERMISSION_DENIED</span><h1>${modName(m)}</h1><p><b>${r.n}</b> has no grant for <span class="mono">${k}</span> at scope <span class="mono">${r.scope}</span>. The server returns 403 for this module even when the menu item is visible, so guessing a URL or ID does not help.</p><div class="chips" style="justify-content:center"><span class="chip">deny by default</span><span class="chip">correlationId 7f3c…a1</span><span class="chip">audited</span></div><button class="btn" data-act="go" data-v="home">${ic('arrow-left')}Back to my workspace</button></div>`}

function rolesPage(){let h=`<div class="ph"><div class="ph-main"><span class="eyebrow">${L('Design map','Khariidadda naqshadda')}</span><h1>${L('Every role, every user','Doorar kasta, isticmaale kasta')}</h1><p class="muted" style="margin:0;max-width:75ch">${ROLES.length} roles across 10 levels, plus 2 system actors. Each card shows the sample user, how far their access reaches and the rule that limits them. Select a card to open HospitalOS as that person.</p></div></div>`;
 TIERS.forEach(([t])=>{const rs=ROLES.filter(r=>r.t===t);h+=`<div class="tier-h"><h2>${tierName(t)}</h2><span class="n">L${t} · ${rs.length} ${rs.length>1?'roles':'role'}</span></div><div class="roles">${rs.map(r=>`<button class="rc" data-act="as" data-v="${r.id}"><div class="top-r"><span class="avatar">${initials(r.p)}</span><div style="min-width:0"><h3>${r.n}</h3><span class="faint" style="font-size:12px">${r.p}</span></div></div><p>${r.note}</p><div class="ft"><span class="chip">${r.scope}</span><span class="chip">${Object.keys(r.acc).length} modules</span>${r.mfa?'<span class="chip">MFA</span>':''}</div></button>`).join('')}</div>`});
 h+=`<div class="tier-h"><h2>${L('System actors','Jilayaasha nidaamka')}</h2><span class="n">non-human · not switchable</span></div><div class="roles">${SYSTEM_ACTORS.map(a=>`<div class="rc"><div class="top-r"><span class="avatar">${ic(a[2])}</span><h3>${a[0]}</h3></div><p>${a[1]}</p></div>`).join('')}</div>`;return h}

function matrixPage(){const cols=MOD;let h=`<div class="ph"><div class="ph-main"><span class="eyebrow">${L('Design map','Khariidadda naqshadda')}</span><h1>${L('Access matrix','Shaxda ogolaanshaha')}</h1><p class="muted" style="margin:0;max-width:75ch">${ROLES.length} roles × ${MOD.length} modules. Everything not granted is denied. Patient-level access is further limited by care relationship, branch and workflow state.</p><div class="chips" style="margin-top:6px">${Object.entries(LV).map(([k,v])=>`<span class="chip">${lvBadge(k)} ${v}</span>`).join('')}<span class="chip"><span class="x">·</span> no access</span></div></div></div>`;
 h+=`<section class="card"><div class="tbl-wrap"><table class="mx"><thead><tr><th class="rn">Role</th>${cols.map(m=>`<th class="rot" title="${m.n}">${modName(m)}</th>`).join('')}</tr></thead><tbody>`;
 TIERS.forEach(([t])=>{h+=`<tr class="tier"><td class="rn">L${t} · ${tierName(t)}</td><td colspan="${cols.length}"></td></tr>`;ROLES.filter(r=>r.t===t).forEach(r=>{h+=`<tr><td class="rn"><button class="btn sm" style="border:0;padding:0;background:none;height:auto;font-weight:600" data-act="as" data-v="${r.id}">${r.n}</button></td>${cols.map(m=>`<td>${r.acc[m.k]?lvBadge(r.acc[m.k]):'<span class="x">·</span>'}</td>`).join('')}</tr>`})});
 return h+`</tbody></table></div></section>`}

function flowsPage(){const F=[['Outpatient to diagnosis','Register/identify patient,Check-in,Create encounter,Nurse intake,Clinician exam,Orders,Verified results,Diagnosis coding,Sign note,Invoice,Discharge / follow-up'],['Emergency to inpatient','Arrival,Triage,Emergency encounter,Investigations / treatment,Admission request,Bed reservation,Assigned handover,Ward admission,Rounds / transfers,Discharge'],['Radiology','Imaging order,Protocol & patient verification,Schedule,Acquisition,DICOM study registration,Radiologist interpretation,Preliminary (if allowed),Signed final,Critical notification,Clinician acknowledgement'],['Laboratory','Test order,Label / specimen collection,Sample accession,Processing / QC,Result validation,Verified release,Critical value notification,Clinician acknowledgement'],['Prescription & dispensing','Prescriber drafts,Validates & signs,Pharmacy verifies,Batch selection,Stock reservation (transaction),Dispense,Receipt & audit,Return / reversal if needed'],['Surgery','Case request,Room scheduling,Pre-op assessment + consent,Safety checks,Procedure record,Post-anesthesia recovery,Discharge / transfer'],['Revenue cycle','Service performed,Charge captured,Invoice issued,Payment intent,Provider confirmation,Payment allocation,Receipt,Ledger posting,Daily reconciliation'],['Monthly intelligence','Freeze period,Extract verified facts,Validate totals & lineage,Compute KPIs,AI narrative from metrics,Clinical + finance review,Approve,Publish / export,Archive version']];
 const E='patient.created appointment.checked_in encounter.signed admission.created bed.assigned patient.discharged lab.result.finalized imaging.report.signed critical_result.raised medication.dispensed invoice.issued payment.settled refund.approved ledger.entry.posted period.closed analytics.snapshot.ready ai.report.reviewed ai.report.published'.split(' ');
 return`<div class="ph"><div class="ph-main"><span class="eyebrow">${L('Design map','Khariidadda naqshadda')} · Spec §6</span><h1>${L('Workflows & domain events','Socodka shaqada & dhacdooyinka')}</h1><p class="muted" style="margin:0;max-width:75ch">The eight end-to-end journeys every screen supports. Steps run in this order; each transition is checked on the server and written to the audit trail.</p></div></div>
 <div class="g2e">${F.map(f=>card(f[0],`<div class="card-b"><div class="rail">${f[1].split(',').map((s,i,a)=>`<span class="step">${s}</span>${i<a.length-1?'<span class="ar">→</span>':''}`).join('')}</div></div>`)).join('')}</div>
 ${card(L('Cross-module domain events','Dhacdooyinka'),`<div class="card-b"><div class="chips">${E.map(e=>`<span class="chip">${e}</span>`).join('')}</div><p class="muted" style="font-size:12.5px;margin:12px 0 0">Envelope: <span class="mono">eventId, eventType, version, tenantId, hospitalId, aggregateType, aggregateId, happenedAt, actorId, correlationId, idempotencyKey, payload, checksum</span>. Emitted through a transactional outbox; consumers are retry-safe.</p></div>`)}`}

/* ================= ROUTER ================= */
function render(){
 renderShell();const r=role();let h;
 if(S.view==='home'){h=r.home.startsWith('module:')?modulePage(r.home.slice(7)):TPL[r.home](r)}
 else if(S.view==='roles')h=rolesPage();else if(S.view==='matrix')h=matrixPage();else if(S.view==='flows')h=flowsPage();
 else if(S.view.startsWith('m:')){const k=S.view.slice(2);h=r.acc[k]?modulePage(k):deniedPage(k)}
 $('#viewIn').innerHTML=h;icons();save();
}
function openSwitch(){const m=$('#switcher');m.hidden=false;$('#swQ').value='';renderSwitch();$('#swP').textContent=`${ROLES.length} roles in 10 levels. Pick one to see HospitalOS exactly as that person does. In production every simulate-as-user session is audited.`;setTimeout(()=>$('#swQ').focus(),30)}
function renderSwitch(){const q=$('#swQ').value.trim().toLowerCase();$('#swB').innerHTML=TIERS.map(([t])=>{const rs=ROLES.filter(r=>r.t===t&&(!q||(r.n+' '+r.p+' '+r.id).toLowerCase().includes(q)));if(!rs.length)return'';return`<div class="tg"><h4><span class="mono">L${t}</span>${tierName(t)}</h4>${rs.map(r=>`<button class="ro ${r.id===S.role?'on':''}" data-act="as" data-v="${r.id}"><span class="avatar">${initials(r.p)}</span><span><b>${r.n}</b><span>${r.p} · ${r.scope}</span></span></button>`).join('')}</div>`}).join('')||`<p class="muted">No role matches “${q}”.</p>`;icons()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
 if(a==='go'){S.view=v;S.bed=null;$('#app').classList.remove('nav-open');render();window.scrollTo(0,0)}
 else if(a==='switch'){openSwitch()}
 else if(a==='closeswitch'){$('#switcher').hidden=true}
 else if(a==='as'){S.role=v;S.view='home';S.bed=null;$('#switcher').hidden=true;$('#app').classList.remove('nav-open');render();window.scrollTo(0,0);toast(`${L('Now viewing as','Hadda waxaad u muuqataa')} ${RO[v].n} · ${RO[v].p}`,'user-round-check')}
 else if(a==='locked'){S.locked=!S.locked;render()}
 else if(a==='cur'){S.cur=v;render()}
 else if(a==='lang'){S.lang=v;render()}
 else if(a==='theme'){const root=document.documentElement;const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';save()}
 else if(a==='opennav'){$('#app').classList.add('nav-open')}
 else if(a==='closenav'){$('#app').classList.remove('nav-open')}
 else if(a==='feat'){const on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);toast(`${v} ${on?'enabled':'disabled'} · change recorded in audit log`)}
 else if(a==='bed'){S.bed=+v;render()}
 else if(a==='toast'){toast(v)}
 else if(a==='notify'){toast(L('3 alerts: critical K+ result, CT-2 out of service, 2 refunds awaiting approval','3 digniinood: natiijo khatar ah, CT-2 ma shaqaynayo, 2 celin'),'bell')}
 else if(a==='ack'){t.outerHTML=`<div class="note ok">${ic('check-circle-2')}<span>Acknowledged by Dr. Mahad Nuur · read-back confirmed · 08:38</span></div>`;icons();toast('Critical value acknowledgement recorded')}
 else if(a==='sign'||a==='reauth'){const box=$(a==='sign'?'#signBox':'#reauthBox');if(box){box.innerHTML=`<div class="mfa">${ic('smartphone')}<span style="font-size:13px">${L('Enter the 6-digit code from your authenticator','Geli koodhka 6-da god')}</span><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="••••••" aria-label="MFA code"><button class="btn sm pri" data-act="mfaok">${L('Confirm','Xaqiiji')}</button></div>`;icons();$('#mfaCode').focus()}}
 else if(a==='mfaok'){const c=$('#mfaCode');if(!c||!/^\d{6}$/.test(c.value)){toast(L('Enter all 6 digits to continue','Geli dhammaan 6-da god'),'alert-circle');return}t.closest('.mfa').outerHTML=`<div class="note ok" style="margin-top:10px">${ic('badge-check')}<span>${L('Signed and approved. Saved as an immutable version with an audit event.','Waa la saxiixay oo la ansixiyay.')}</span></div>`;icons();toast(L('Approved · audit event written','La ansixiyay · waa la diiwaangeliyay'))}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-act="chk"]'))toast(e.target.checked?'Checklist item confirmed · timestamped':'Checklist item reopened')});
$('#swQ').addEventListener('input',renderSwitch);
$('#switcher').addEventListener('click',e=>{if(e.target.id==='switcher')$('#switcher').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#switcher').hidden=true;$('#app').classList.remove('nav-open')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSwitch()}});
render();
</script>
