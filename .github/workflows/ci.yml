# Spec §13.3 release pipeline (the parts that run on every change): types → tests → dependency scan → build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Types (policy, terminology, api, web)
        run: npm run typecheck
      - name: Unit, API, concurrency, security and AI-validation tests
        run: npm test
      - name: Dependency vulnerabilities (production packages)
        run: npm audit --omit=dev --audit-level=high
      - name: Web build
        run: npm -w @fahan/web run build
